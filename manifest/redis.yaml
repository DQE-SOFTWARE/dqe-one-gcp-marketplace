# Bundled Redis (replaces Cloud Memorystore + VPC Connector)
apiVersion: v1
kind: Service
metadata:
  name: ${name}-redis
  namespace: "${namespace}"
  labels:
    app.kubernetes.io/name: "${name}"
    app.kubernetes.io/component: redis
spec:
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
  selector:
    app.kubernetes.io/name: "${name}"
    app.kubernetes.io/component: redis
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ${name}-redis
  namespace: "${namespace}"
  labels:
    app.kubernetes.io/name: "${name}"
    app.kubernetes.io/component: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: "${name}"
      app.kubernetes.io/component: redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: "${name}"
        app.kubernetes.io/component: redis
    spec:
      containers:
        - name: redis
          image: "${imageRedis}"
          ports:
            - containerPort: 6379
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 6379
            initialDelaySeconds: 15
            periodSeconds: 30
