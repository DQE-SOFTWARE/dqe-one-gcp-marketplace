apiVersion: v1
kind: Secret
metadata:
  name: ${name}-secrets
  namespace: "${namespace}"
  labels:
    app.kubernetes.io/name: "${name}"
type: Opaque
# "data": values already base64-encoded (GENERATED_PASSWORD with base64: True)
data:
  admin-password: "${adminPassword}"
  db-password: "${dbPassword}"
  secret-key: "${djangoSecretKey}"
# "stringData": plain values, Kubernetes encodes them itself
stringData:
  admin-user: "${adminUser}"
  db-user: "dqeone"
  licence: "${dqeClientLicence}"
  # Fernet key: the generated value (already base64, 44 characters) IS the
  # key itself, hence stringData and not data (see schema.yaml)
  encryption-key: "${encryptionKey}"
