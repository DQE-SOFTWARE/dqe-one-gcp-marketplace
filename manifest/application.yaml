apiVersion: app.k8s.io/v1beta1
kind: Application
metadata:
  name: "${name}"
  namespace: "${namespace}"
  labels:
    app.kubernetes.io/name: "${name}"
  annotations:
    kubernetes-engine.cloud.google.com/icon: >-
      data:image/png;base64,
    marketplace.cloud.google.com/deploy-info: '{"partner_id": "dqe-one-public", "product_id": "dqe-one-standalone", "partner_name": "DQE Software"}'
spec:
  descriptor:
    type: DQE-One
    version: "__RELEASE_VERSION__"
    description: >-
      DQE-One: data quality platform (validation, standardization,
      deduplication) by DQE Software.
    maintainers:
      - name: DQE Software
        url: https://www.dqe-software.com
    links:
      - description: DQE Software website
        url: https://www.dqe-software.com
    notes: |-
      # Access DQE-One

      ```shell
      kubectl port-forward --namespace ${namespace} svc/${name}-dqeone 8001:8001
      ```
      Then open http://localhost:8001

      # Administrator credentials

      ```shell
      kubectl get secret ${name}-secrets --namespace ${namespace} \
        -o jsonpath='{.data.admin-user}' | base64 -d; echo
      kubectl get secret ${name}-secrets --namespace ${namespace} \
        -o jsonpath='{.data.admin-password}' | base64 -d; echo
      ```
  info:
    - name: Administrator username
      type: Reference
      valueFrom:
        secretKeyRef:
          name: ${name}-secrets
          key: admin-user
    - name: Administrator password
      type: Reference
      valueFrom:
        secretKeyRef:
          name: ${name}-secrets
          key: admin-password
  selector:
    matchLabels:
      app.kubernetes.io/name: "${name}"
  componentKinds:
    - group: v1
      kind: Secret
    - group: v1
      kind: Service
    - group: v1
      kind: PersistentVolumeClaim
    - group: apps/v1
      kind: Deployment
    - group: apps/v1
      kind: StatefulSet
  addOwnerRef: true
